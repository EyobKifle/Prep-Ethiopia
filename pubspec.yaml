name: prep_ethiopia
description: Prep Ethiopia - A high-powered, offline-first educational platform for Ethiopia.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  intl: ^0.19.0

  # Diagnostics, Utilities & Assets
  connectivity_plus: ^6.0.0
  path_provider: ^2.1.0
  file_picker: ^13.1.0
  flutter_markdown_plus: ^1.0.7
  google_fonts: ^6.1.0
  dio: ^5.9.2
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # Session Persistence
  flutter_secure_storage: ^10.3.4

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # YouTube Player
  youtube_player_flutter: ^9.1.0
  url_launcher: ^6.2.0

  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^33.2.15

  # Supabase SDK
  supabase_flutter: ^2.6.0

dependency_overrides:
  android_file_picker:
    path: third_party/android_file_picker


dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

  # Isar Schema Code Generator
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/subjects/
    - assets/icons/
    - assets/textbooks/grade_5/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0B62FF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

